name = "bagshop"
compatibility_date = "2025-06-01"
pages_build_output_dir = "public"

# --- Database (create with: wrangler d1 create bagshop) ---
[[d1_databases]]
binding = "DB"
database_name = "bagshop"
database_id = "4079a9c7-057b-4cc4-be97-33c998b62464"

# --- Photo storage (create with: wrangler r2 bucket create bagshop-photos) ---
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bagshop-photos"

# --- Environment variables ---
# DEV = "1" ONLY for local testing (bypasses admin login). MUST be "0" in production.
# ALLOWED_EMAILS = comma-separated emails allowed into the admin (matches Cloudflare Access).
[vars]
DEV = "0"
ALLOWED_EMAILS = "1mohsinusmani@gmail.com,mauhidusmani@gmail.com"
