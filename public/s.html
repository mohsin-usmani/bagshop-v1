<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>FinEx — Catalogue</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='47' fill='%233b4cca'/%3E%3Ctext x='50' y='69' text-anchor='middle' fill='white' font-family='Arial%2Csans-serif' font-weight='700' font-style='italic' font-size='50'%3EFx%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/styles.css?v=64">
</head>
<body>

<!-- ── NAVBAR ── -->
<nav class="navbar" id="navbar">
  <!-- Desktop-only: single row, Myntra-style — logo, admin's categories
       inline, a small always-visible pill search box, then history/cart.
       Mobile keeps the two-row nav-top + hamburger menu below untouched. -->
  <div class="navbar-desktop" id="navbarDesktop">
    <a class="nav-logo-link" href="#" onclick="goHome();return false">
      <svg class="nav-logo-svg" viewBox="0 0 172 60" xmlns="http://www.w3.org/2000/svg" aria-label="FinEx" style="color:#e8202a">
        <text x="0" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="-1.5" fill="currentColor">FinEx</text>
      </svg>
      <span class="nav-shopname" id="navdShopName"></span>
    </a>
    <div class="navd-cats" id="navdCatsBar"></div>
    <div class="navd-search">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="navdSearchInput" placeholder="Search…" oninput="onSearchInput(this.value)" autocomplete="off">
    </div>
    <div class="navd-icons">
      <button class="nav-icon-btn" onclick="openHistory()" aria-label="My orders" title="My past orders">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="nav-icon-btn nav-cart-btn" onclick="openCart()" aria-label="Cart">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="nav-cart-badge" id="navdCartBadge" style="display:none">0</span>
      </button>
    </div>
  </div>
  <div class="nav-top">
    <div class="nav-left">
      <button class="nav-icon-btn" id="searchToggleBtn" onclick="toggleNavSearch()" aria-label="Search">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
    </div>
    <div class="nav-center">
      <a class="nav-logo-link" href="#" onclick="goHome();return false">
        <svg class="nav-logo-svg" viewBox="0 0 172 60" xmlns="http://www.w3.org/2000/svg" aria-label="FinEx" style="color:#e8202a">
          <text x="0" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="-1.5" fill="currentColor">FinEx</text>
        </svg>
        <span class="nav-shopname" id="navShopName"></span>
      </a>
    </div>
    <div class="nav-right">
      <button class="nav-icon-btn" onclick="openHistory()" aria-label="My orders" title="My past orders">
        <svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l3 2"/></svg>
      </button>
      <button class="nav-icon-btn nav-cart-btn" onclick="openCart()" aria-label="Cart">
        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="nav-cart-badge" id="navCartBadge" style="display:none">0</span>
      </button>
      <button class="nav-ham-btn" id="hamBtn" onclick="toggleMenu()" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <!-- Desktop category links (hidden on mobile) -->
  <div class="nav-cats-bar" id="navCatsBar"></div>
  <!-- Search bar (slides down) -->
  <div class="nav-search-bar" id="navSearchBar" style="display:none">
    <div class="nav-search-inner">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="navSearchInput" placeholder="Search products…" oninput="onSearchInput(this.value)" autocomplete="off">
      <button onclick="closeNavSearch()">✕</button>
    </div>
  </div>
</nav>


<!-- ── MOBILE MENU ── -->
<div class="mob-overlay" id="mobOverlay" onclick="closeMenu()"></div>
<div class="mob-menu" id="mobMenu">
  <!-- Main panel -->
  <div class="mob-panel" id="mobPanelMain">
    <div class="mob-menu-top">
      <svg class="nav-logo-svg" style="height:24px;color:#e8202a" viewBox="0 0 172 60" xmlns="http://www.w3.org/2000/svg" aria-label="FinEx">
        <text x="0" y="46" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="50" letter-spacing="-1.5" fill="currentColor">FinEx</text>
      </svg>
      <span id="mobShopName" style="font-weight:700;font-size:15px"></span>
      <button class="mob-close-btn" onclick="closeMenu()">✕</button>
    </div>
    <div class="mob-cats-list" id="mobCatsList"></div>
    <div class="mob-menu-foot" id="mobMenuFoot"></div>
  </div>
  <!-- Sub panel (slides over main) -->
  <div class="mob-panel mob-panel-sub" id="mobPanelSub" style="display:none">
    <div class="mob-menu-top mob-sub-top">
      <button class="mob-back-btn" onclick="closeMobSubCat()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="mobSubTitle">CATEGORY</span>
      </button>
      <button class="mob-close-btn" onclick="closeMenu()">✕</button>
    </div>
    <div class="mob-sub-content" id="mobSubContent"></div>
  </div>
</div>

<!-- ── MAIN APP ── -->
<div id="app" style="padding-top:56px">
  <div class="notice muted">Loading catalogue…</div>
</div>

<!-- ── MOBILE FILTER PANEL ── -->
<div class="filter-overlay" id="filterOverlay" onclick="closeMobFilters()"></div>
<div class="filter-panel" id="filterPanel">
  <div class="filter-panel-head">
    <span style="font-weight:700;font-size:15px">Filters</span>
    <button class="filter-clear-all" onclick="clearAllFilters()">Clear all</button>
    <button class="mob-close-btn" onclick="closeMobFilters()">✕</button>
  </div>
  <div class="filter-panel-body" id="filterPanelBody"></div>
  <div class="filter-panel-foot">
    <button class="btn-apply-filters" onclick="closeMobFilters()">Show Results</button>
  </div>
</div>

<!-- ── ORDER HISTORY DRAWER ── -->
<div class="drawer" id="historyDrawer" onclick="if(event.target===this)closeHistory()">
  <div class="sheet">
    <div class="hd"><h3>My past orders</h3><button class="sheet-close" onclick="closeHistory()">✕</button></div>
    <div id="historyBody"><p class="muted" style="padding:8px">Loading…</p></div>
  </div>
</div>

<!-- ── CART DRAWER ── -->
<div class="drawer" id="drawer" onclick="if(event.target===this)closeCart()">
  <div class="sheet">
    <div class="hd">
      <div style="display:flex;align-items:center;gap:12px">
        <h3>Your order</h3>
        <button class="cart-empty-btn" id="cartEmptyBtn" onclick="emptyCart()" style="display:none">Empty cart</button>
      </div>
      <button class="sheet-close" onclick="closeCart()">✕</button>
    </div>
    <div id="cartLines"></div>
    <div id="cartTotal" class="cart-total-row"></div>
    <button class="btn-send-order" onclick="sendOrder()">Send Order on WhatsApp</button>
    <p class="muted" style="font-size:12px;text-align:center;margin-top:10px">This opens WhatsApp with your order ready to send.</p>
  </div>
</div>

<!-- ── PRODUCT MODAL ── -->
<div class="prod-modal" id="prodModal">
  <div class="prod-modal-inner">
    <button class="modal-close-btn" onclick="closeDetail()">&#10005;</button>
    <div class="prod-modal-body" style="flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0"></div>
  </div>
</div>

<script src="/assets/common.js?v=34"></script>
<script src="/assets/catalog.js?v=51"></script>
</body>
</html>
